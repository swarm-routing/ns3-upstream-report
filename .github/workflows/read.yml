name: read

# P2 read (cmd/upstream read): every tracked issue's and merge request's state
# into the mirror ticket's status block, every new GitLab note as a comment,
# stalls flagged; with the token, an issue 30 days before it expires.
# Environment gitlab-read (main only, no reviewer) holds GITLAB_TOKEN (the
# one `api` token, maintainer decision 2026-11-16); read is built from
# packages with no GitLab write client (internal/gitlabwrite), so it sends GET
# only. Without the token it reads GitLab's public pages.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read only; print the GitHub writes instead of making them
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream-read
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: gitlab-read
    permissions:
      contents: read
      issues: write
    steps:
      # only GitHub's own actions and this repository's in a job that holds the GitLab token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bridge (cmd/upstream)
        uses: ./.github/actions/upstream
        timeout-minutes: 5
      - name: Mirror GitLab into the tickets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            upstream read --dry-run
          else
            upstream read
          fi
