name: lifecycle

# P6 lifecycle (docs/adr/0002-a-zero-manual-pipeline-to-ns-3s-gitlab.md): daily,
# when a merge request of ours is merged upstream and an ns-3 release tag
# contains its commit (cmd/upstream lifecycle), and a P1 verify ran on a master
# that contains it (else wait, said once on the ticket; #79), say "fixed in ns-3.X" on the mirror ticket, open one
# issue per workaround the register lists, and close the RCAPA ticket once
# all of them are closed (PROC-001). GitLab is read without a token; the
# issues in other repositories need the org bot's token (BOT_APP_ID and
# BOT_APP_PRIVATE_KEY): without it the run says what waits for it.
# It also records P3's publishes: when a report went out (the `upstream-sent:
# publish` marker) and tracked.toml lacks its issue, the org bot opens the pull
# request that sets `state = "published"` and `issue` (internal/record). That is
# why it runs after every send run too: workflow_run runs main's workflow and
# code, and this job holds no GitLab token.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_run:
    workflows: [send]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bridge (cmd/upstream)
        uses: ./.github/actions/upstream
        timeout-minutes: 5
      - id: bot
        uses: swarm-routing/.github/.github/actions/bot-token@b5b86a5aa5ff5d2ddbd9f08d02489b4535379dce # main@2026-11-24
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Releases, workaround issues, RCAPA tickets, the register pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
        run: upstream lifecycle
