name: rotate

# P7 credentials (docs/adr/0002-a-zero-manual-pipeline-to-ns-3s-gitlab.md, D5):
# weekly, each environment's GitLab token is rotated once it is 60 days old
# (or expires within 14 days) with GitLab's self-rotation, which revokes the
# old token, and the new one is stored as the environment's secret with the
# org App's token. The App's access is checked first, so no token is rotated
# that could not be stored; a failure opens an issue. Until the App has
# `secrets: write` on this repository the run only says so.
on:
  schedule:
    - cron: '29 4 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        env: [gitlab-read, gitlab-write]
    environment: ${{ matrix.env }}
    permissions:
      contents: read
      issues: write
    steps:
      # only GitHub's and the org's own actions in a job that holds the GitLab token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app
        uses: swarm-routing/.github/.github/actions/bot-token@c42e1e3f377099c980f04cee9a9148a344dd876e # main 2026-11-16
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: PyNaCl, for the secret's sealed box
        timeout-minutes: 3
        run: python3 -m pip install --user --quiet --only-binary ':all:' pynacl==1.5.0
      - name: Rotate and store
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          ENV_NAME: ${{ matrix.env }}
        # not -I: PyNaCl is in the user site
        run: python3 tools/upstream/upstream.py rotate --env "$ENV_NAME"
