name: CI

# tools/ passes ruff and its self-test (fixtures of nsnam/ns-3-dev's public
# GitLab pages, a fake GitHub and a fake GitLab: no token, no network) under
# coverage (report-only); the workflows pass actionlint and tracked.toml
# validates. Licence headers and the org-sync drift check run in their own
# workflows (licence.yml, org-sync.yml).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tracked.toml validates; reports/ and replies/ pass the outbound guards
        run: |
          python3 -I tools/upstream/upstream.py validate
          python3 -I tools/upstream/upstream.py lint
      - name: actionlint
        timeout-minutes: 5  # one download (org CONTRIBUTING invariant 5)
        env:
          # actionlint 1.7.12's own release, checked against its sha256 (the release's checksums.txt)
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          pip install --quiet --only-binary :all: shellcheck-py==0.10.0.1
          curl --proto =https --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tgz" "$ACTIONLINT_URL"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  python:
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@main
    with:
      paths: tools
      tests: tools/upstream/test_upstream.py
      source: tools
