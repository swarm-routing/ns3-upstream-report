name: CI

# The Go tool (cmd/upstream, internal/) passes the org's Go checks
# (reusable-go-ci.yml: build, gofmt, vet, staticcheck, govulncheck, go test -race
# against the fixtures, a fake GitHub and a fake GitLab: no token, no network), its
# coverage goes to Codecov (report-only) and, with the code, to SonarQube Cloud
# (CI-based analysis, job `sonar`); the workflows pass actionlint, tracked.toml
# validates and reports/ and replies/ pass the outbound guards. Licence headers and
# the org-sync drift check run in their own workflows (licence.yml, org-sync.yml).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bridge (cmd/upstream)
        uses: ./.github/actions/upstream
        timeout-minutes: 5
      - name: tracked.toml validates; reports/ and replies/ pass the outbound guards
        run: |
          upstream validate
          upstream lint
      - name: actionlint
        timeout-minutes: 5  # one download (org CONTRIBUTING invariant 5)
        env:
          # actionlint 1.7.12's own release, checked against its sha256 (the release's checksums.txt)
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # the hash-pinned lock of .github/requirements/ci.in (swarm-routing/.github#716)
          pip install --quiet --only-binary :all: --require-hashes -r .github/requirements/ci.txt
          curl --proto =https --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tgz" "$ACTIONLINT_URL"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  go:
    uses: swarm-routing/.github/.github/workflows/reusable-go-ci.yml@2d2c557c2d25e899fb487edd599056096b218d3f # main@2026-11-22

  codecov:
    needs: go
    if: ${{ !cancelled() && needs.go.result != 'skipped' }}
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@2d2c557c2d25e899fb487edd599056096b218d3f # main@2026-11-22
    with:
      artifact: go-coverage
      flags: go

  # SonarQube Cloud, CI-based analysis (Automatic Analysis is off for this project,
  # maintainer 2026-11-16): sonar-project.properties, with a Go coverage profile of every
  # package by every test. The quality gate posts as its own check.
  sonar:
    needs: go
    if: ${{ !cancelled() && needs.go.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@2d2c557c2d25e899fb487edd599056096b218d3f # main@2026-11-22
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0  # SonarQube Cloud reads the history (blame, new code)
      # The coverage SonarQube Cloud reads is of every package by every test
      # (-coverpkg=./...): reusable-go-ci.yml's profile counts each package by its own
      # tests only, so code the command-line tests run (internal/github, the write
      # client) would read as uncovered. Built and run as the `go` job builds it.
      - name: Go (the go.mod toolchain)
        if: steps.changes.outputs.docs-only != 'true'
        uses: ./.github/actions/upstream
        timeout-minutes: 5
      - name: Coverage of every package by every test
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 10
        env:
          GOTOOLCHAIN: local
        run: |
          mkdir -p coverage
          go test -covermode=atomic -coverpkg=./... -coverprofile=coverage/coverage.out ./...
      - name: SonarQube Cloud token
        if: steps.changes.outputs.docs-only != 'true'
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$FORK" = true ]; then
            echo "::notice::SonarQube Cloud analysis skipped: a fork's pull request gets no SONAR_TOKEN"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::SONAR_TOKEN is not available to this repository: the analysis cannot run"
          exit 1
      - name: SonarQube Cloud analysis
        if: steps.changes.outputs.docs-only != 'true' && (steps.token.outputs.run == 'true')
        timeout-minutes: 10
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
