name: Licence

# The Go tool (cmd/, internal/) is MIT OR GPL-2.0-only, everything else
# GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@c3c43feb883bae105f6cf3b38e35a14e494d3890 # main@2026-11-22
    with:
      dual-roots: cmd/ internal/
      core-roots: ''
