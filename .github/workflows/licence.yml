name: Licence

# The Go tool (cmd/, internal/) is MIT OR GPL-2.0-only, everything else
# GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@78dd3d7f572c715b41993f9e18b41572d1072ea4 # main@2026-11-22
    with:
      dual-roots: cmd/ internal/
      core-roots: ''
