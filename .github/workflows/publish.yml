name: publish

# /publish files the Report text of a mirror ticket on GitLab (a new issue, or a note on its target)
# (tools/upstream/upstream.py). The gate job has no secret: it checks the
# comment and the ticket, and writes the exact text and its sha256 to its run
# summary. The send job runs in environment gitlab-write, so nothing reaches
# GitLab until the maintainer approves the deployment (main only); it reads
# the ticket again and sends only if the text still has that sha256.
# issue_comment runs this file and the tool from main, never from a pull
# request; the comment is read through the API, never interpolated here.
# Agents never comment /publish and never approve a deployment
# (docs/adr/0002-the-deployment-approval-is-the-gate.md).
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    if: >-
      github.event.issue.pull_request == null
      && startsWith(github.event.comment.body, '/publish')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issue: ${{ steps.gate.outputs.issue }}
      sha256: ${{ steps.gate.outputs.sha256 }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        name: Check the comment, show the text to approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/upstream/upstream.py gate publish

  send:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: gitlab-write
    # one send per ticket at a time, so a second /publish sees the first one's marker
    concurrency:
      group: upstream-write-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      # no third-party action in a job that holds the GitLab token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Send to GitLab, link back
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          SHA256: ${{ needs.gate.outputs.sha256 }}
        run: python3 -I tools/upstream/upstream.py publish --issue "$ISSUE" --sha256 "$SHA256"
