# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "python"
# bestpractices.dev project (OpenSSF Best Practices badge; id read from the site's public JSON, swarm-routing/.github#531)
bestpractices_project = "16822"
# the tool is Go (swarm-routing/.github docs/adr/0002-pipelines-are-go.md); org-sync has no Go kind,
# so the kind stays "python" (its templates fit a tooling repository), the Python badge is left out and the Go badge is this repository's own
badges = ["ci", "release", "doi", "cite", "vcpkg", "pypi", "licence", "conventional", "arena", "scorecard", "bestpractices", "rcapa", "ns3-bugs"]
title = "ns3-upstream-report"
dual = ["cmd/", "internal/"]
# CITATION.cff seed and cite badge (swarm-routing/.github#636: versioned releases). Once
# Zenodo archives the first release, org-bot's `zenodo` task sets zenodo_concept.
citation = true
# the org's issue forms, copied: this repository has its own form (upstream-report.yml)
forms = true
posture = "the org's bridge to ns-3's GitLab: one Go tool (cmd/upstream) and its workflows, no simulation code"
description = """
The bridge between the swarm-routing org and ns-3's GitLab
(https://gitlab.com/nsnam/ns-3-dev). Each upstream report (an ns-3 bug with
an `NS3-NNN` id and an RCAPA in swarm-routing/ns3-tools) has a **mirror
ticket** here, and pipelines carry it from the first draft to the fix
shipping in an ns-3 release, with no manual step: an agent drafts each text
as a pull request, CI checks it, P2 read mirrors GitLab every 6 h, and P3/P4
send a merged text after a veto window that the `hold` label stops."""
trust_boundary = """
Two inputs are untrusted. **GitLab notes** (anyone on gitlab.com can write
one) are quoted into mirror-ticket comments by the bridge (`cmd/upstream`):
it never executes them, neutralises hidden-comment markers, `@mentions` and
`#N` links before quoting, and reads its own markers only from the first line
of comments the workflow's bot wrote. **Text bound for GitLab** comes only
from files merged to `main` (`reports/`, `replies/`), never from a comment,
and passes the guards before every API call: references, the disclosure
footer, the scope allowlist (`nsnam/ns-3-dev`, the item's own threads, no
close, label, approval or merge), rate limits and fresh P1 evidence. Agents
act on GitHub as the maintainer's own user, so no actor check or approval
click is a control; the guards assume an agent wrote everything
(docs/adr/0002-a-zero-manual-pipeline-to-ns-3s-gitlab.md)."""
limitations = """
- **A reviewed mistake can still go out.** A text that passes its pull
  request and the guards is sent when its veto window ends, unless someone
  labels the ticket `hold`.
- **One token reads and writes.** By the maintainer's decision (2026-11-16)
  the one GitLab token (scope `api`) is in both environments; the read and
  lifecycle pipelines are built without the GitLab write client, and P7
  rotates the token every 60 days with a 90-day expiry.
- **The bridge does not judge content.** It checks references, scope, rate
  and evidence, not whether a report is right; P1 verify and the review of
  the pull request do that."""
verifying = """
Nothing is released: the workflows run from `main`. Every post is announced
on its mirror ticket (an `upstream-scheduled` comment with its exact text)
and linked back after it is sent (an `upstream-sent` comment)."""

[[extra_badges]]
group = "stack"
alt = "Go 1.27"
image = "https://img.shields.io/badge/go-1.27-blue?logo=go"
link = "go.mod"

[docs]
arena_id = ""  # its id in swarm-routing.github.io site/hub/projects.json, once listed

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "The swarm-routing org's bridge to ns-3's GitLab: a mirror ticket and a zero-manual pipeline per upstream ns-3 bug report, from draft and verification to publishing, replies, MR upkeep and the release that fixes it."
homepage = ""
topics = ["ns-3", "gitlab", "issue-tracking", "automation", "swarm-intelligence"]
ruleset = "tooling"
required_checks = ["go / go", "workflows", "headers / licence", "check / org-sync", "title / title", "review / coderabbit"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true

# The GitLab token lives in these environments, never in a repository secret; the
# maintainer stores it once. No required reviewer: the veto window is the gate (D1 (a),
# docs/adr/0002-a-zero-manual-pipeline-to-ns-3s-gitlab.md).
[settings.environments.gitlab-read]
branches = ["main"]

[settings.environments.gitlab-write]
branches = ["main"]
