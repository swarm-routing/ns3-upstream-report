# SonarQube Cloud, CI-based analysis (ci.yml, job `sonar`; Automatic Analysis is off).
sonar.organization=swarm-routing
sonar.projectKey=swarm-routing_ns3-upstream-report
sonar.sourceEncoding=UTF-8

# The analysis scope is the whole project (SonarQube Cloud's analysis scope; it ignores
# sonar.sources, sonar.tests and sonar.test.inclusions): the Go analyser takes *_test.go
# as tests and the rest of cmd/ and internal/ as sources. The recorded GitLab pages are
# data, not code.
sonar.exclusions=**/testdata/**,coverage/**
# The tests themselves and internal/fake (the tests' GitLab and GitHub) are not code to
# cover: on main the analysis scope counts *_test.go as sources with 0 % coverage
sonar.coverage.exclusions=**/*_test.go,internal/fake/**

# ci.yml's `sonar` job writes it: go test -coverpkg=./... (every package by every test)
sonar.go.coverage.reportPaths=coverage/coverage.out
