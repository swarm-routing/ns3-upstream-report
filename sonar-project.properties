# SonarQube Cloud, CI-based analysis (ci.yml, job `sonar`; Automatic Analysis is off).
sonar.organization=swarm-routing
sonar.projectKey=swarm-routing_ns3-upstream-report
sonar.sourceEncoding=UTF-8

# The Go tool's code as sources, its tests as tests; the recorded fixtures are data.
sonar.sources=cmd,internal,go.mod
sonar.exclusions=**/*_test.go,**/testdata/**
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
# internal/fake is the tests' GitLab and GitHub: test support, not covered code
sonar.coverage.exclusions=internal/fake/**

# The `go` job's profile (reusable-go-ci.yml, artifact go-coverage), downloaded to coverage/
sonar.go.coverage.reportPaths=coverage/coverage.out
